# Netlify configuration for clean URLs

[build]
  publish = "docs"
  functions = "netlify/functions"

# Reports booked / follow-up stage changes to Meta. SLOT_MS in the function must match.
[functions."meta-crm-sync"]
  schedule = "*/15 * * * *"

# Enable clean URLs (remove .html extension)
[[redirects]]
  from = "/*"
  to = "/:splat.html"
  status = 200
  force = false
  
# This tells Netlify to serve .html files when accessing URLs without extension
# Example: /trial/offer → serves /trial/offer.html
